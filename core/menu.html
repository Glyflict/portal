<style>.menu-bar {
	position: fixed;
	top: 0;
	left: 0;
	width: 100%;
	height: 3.5rem;
	box-sizing: border-box;
	background-color: #17141A;
	display: flex;
	align-items: center;
	justify-content: center;
	gap: 0rem;
	z-index: 1000;
}

.menu-bar a.install-button {font-weight:700; color: #FFFFFF;font-size: 1.25rem;
background-color: #B640FF;position: absolute;right: 0.5rem;display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: center;
}

.menu-bar a {
	color: #FFFFFF;
	text-decoration: none;
	font-family: Arial, sans-serif;
	font-size: 0.875rem;
	height: 3.5rem;
  line-height: 3.5rem;
	padding: 0rem 1rem;
}

.menu-bar a:hover {
	text-decoration: none;
	color: #000000; background-color: #FFFFFF;
}

.title-button {position: absolute;left: 0;display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: center;height: 3.5rem;}
.title-button img {height: 3rem; padding: 0.25rem;}
</style>


<div class="menu-bar">
	<a href="/portal/" class="title-button"><img src="/portal/res/logo.png"></a>

	<a href="/portal/index.html#updates">アップデート</a>
	<a href="/portal/pages/library/">ライブラリ</a>

</select>
